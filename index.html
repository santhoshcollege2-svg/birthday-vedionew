<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#061525">
    <meta name="description" content="A cinematic birthday story for Archana">

    <title>For Archana ♥</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- =========================================================
     GLOBAL DECORATIVE LAYERS
========================================================= -->

<div id="particles" class="particles-layer"></div>
<div id="sparkles" class="sparkles-layer"></div>

<div id="transition-overlay" class="transition-overlay"></div>

<!-- =========================================================
     APP
========================================================= -->

<main id="app">

    <!-- =====================================================
         INTRO / TAP TO BEGIN SCENE
    ====================================================== -->

    <section
        id="intro-screen"
        class="scene active"
        data-scene="intro"
    >

        <div class="intro-content">

            <p class="intro-text">
                A Little Surprise For You......
            </p>

            <button
                id="tap-to-begin-button"
                class="intro-tap-button"
            >
                Are You Ready..
            </button>

        </div>

    </section>


    <!-- =====================================================
         WELCOME SCENE
    ====================================================== -->

    <section
        id="welcome-screen"
        class="scene"
        data-scene="welcome"
    >
   

        <div class="welcome-background">

            <div class="welcome-glow glow-1"></div>
            <div class="welcome-glow glow-2"></div>
            <div class="welcome-glow glow-3"></div>

            <div class="bokeh bokeh-1"></div>
            <div class="bokeh bokeh-2"></div>
            <div class="bokeh bokeh-3"></div>
            <div class="bokeh bokeh-4"></div>
            <div class="bokeh bokeh-5"></div>
            <div class="bokeh bokeh-6"></div>

            <div class="glitter-ground"></div>
            <div class="film-grain"></div>
            <div class="vignette"></div>

        </div>

        <div class="scene-content welcome-content">

            <div
                id="welcome-quote-1"
                class="welcome-quote"
            >
                Today is Not Just a Day
            </div>

            <div
                id="welcome-quote-2"
                class="welcome-quote"
            >
                It was My Special Person Birthday
            </div>

            <div
                id="welcome-birthday"
                class="welcome-birthday"
            >
                Happy Birthday
            </div>

            <div
                id="welcome-name"
                class="welcome-name"
            >
                My Dear Lovable Kutty Ma
            </div>

        </div>

    </section>


    <!-- =====================================================
         CAKE SCENE
    ====================================================== -->

    <section
        id="cake-scene"
        class="scene"
        data-scene="cake"
    >

        <div class="cake-background">

            <div class="cake-atmosphere"></div>

            <div class="cake-bokeh cake-bokeh-1"></div>
            <div class="cake-bokeh cake-bokeh-2"></div>
            <div class="cake-bokeh cake-bokeh-3"></div>
            <div class="cake-bokeh cake-bokeh-4"></div>
            <div class="cake-bokeh cake-bokeh-5"></div>
            <div class="cake-bokeh cake-bokeh-6"></div>

            <div id="cake-particles"></div>

            <div class="cake-vignette"></div>

        </div>

        <div class="scene-content cake-content">

            <div id="fireworks"></div>
            <div id="balloons"></div>

            <!-- SVG CAKE -->

            <div
                id="cake"
                class="cake"
            >

                <svg
                    viewBox="0 0 500 450"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-label="Birthday cake"
                >

                    <defs>

                        <linearGradient
                            id="cakeBody"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop offset="0%" stop-color="#102c43"/>
                            <stop offset="50%" stop-color="#071b2d"/>
                            <stop offset="100%" stop-color="#03111e"/>
                        </linearGradient>

                        <linearGradient
                            id="frosting"
                            x1="0"
                            y1="0"
                            x2="0"
                            y2="1"
                        >
                            <stop offset="0%" stop-color="#fff8e8"/>
                            <stop offset="55%" stop-color="#f7e7ce"/>
                            <stop offset="100%" stop-color="#d8c6a8"/>
                        </linearGradient>

                        <linearGradient
                            id="gold"
                            x1="0"
                            y1="0"
                            x2="1"
                            y2="1"
                        >
                            <stop offset="0%" stop-color="#fff1b8"/>
                            <stop offset="30%" stop-color="#f5c86a"/>
                            <stop offset="65%" stop-color="#c58b31"/>
                            <stop offset="100%" stop-color="#ffe3a1"/>
                        </linearGradient>

                        <radialGradient
                            id="flame"
                        >
                            <stop offset="0%" stop-color="#fff"/>
                            <stop offset="30%" stop-color="#ffe29a"/>
                            <stop offset="70%" stop-color="#ffad35"/>
                            <stop offset="100%" stop-color="transparent"/>
                        </radialGradient>

                        <filter
                            id="cakeShadow"
                            x="-50%"
                            y="-50%"
                            width="200%"
                            height="200%"
                        >
                            <feGaussianBlur
                                stdDeviation="10"
                            />
                        </filter>

                        <filter
                            id="glow"
                            x="-100%"
                            y="-100%"
                            width="300%"
                            height="300%"
                        >
                            <feGaussianBlur
                                stdDeviation="5"
                                result="blur"
                            />
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>

                    </defs>

                    <!-- Shadow -->

                    <ellipse
                        cx="250"
                        cy="390"
                        rx="170"
                        ry="28"
                        fill="#000"
                        opacity=".45"
                        filter="url(#cakeShadow)"
                    />

                    <!-- Cake -->

                    <path
                        d="M95 250
                           Q250 225 405 250
                           L385 365
                           Q250 395 115 365 Z"
                        fill="url(#cakeBody)"
                    />

                    <!-- Gold stripe -->

                    <path
                        d="M105 305 Q250 330 395 305"
                        fill="none"
                        stroke="url(#gold)"
                        stroke-width="5"
                        opacity=".75"
                    />

                    <!-- Frosting -->

                    <path
                        d="M90 245
                           Q125 220 160 238
                           Q190 255 220 238
                           Q250 218 280 238
                           Q315 255 345 238
                           Q375 220 410 245
                           L400 285
                           Q380 270 365 288
                           Q350 302 337 280
                           Q320 265 305 285
                           Q290 302 275 278
                           Q255 260 240 283
                           Q220 302 205 280
                           Q185 260 170 282
                           Q150 300 137 278
                           Q120 262 100 280 Z"
                        fill="url(#frosting)"
                    />

                    <!-- Top -->

                    <ellipse
                        cx="250"
                        cy="245"
                        rx="160"
                        ry="45"
                        fill="url(#frosting)"
                    />

                    <!-- Gold pearls -->

                    <g fill="url(#gold)">
                        <circle cx="130" cy="265" r="6"/>
                        <circle cx="155" cy="277" r="4"/>
                        <circle cx="190" cy="265" r="5"/>
                        <circle cx="315" cy="267" r="5"/>
                        <circle cx="350" cy="275" r="4"/>
                        <circle cx="375" cy="260" r="6"/>
                    </g>

                    <!-- Candles -->

                    <g class="candles">

                        <g class="candle candle-1">
                            <rect
                                x="190"
                                y="160"
                                width="18"
                                height="75"
                                rx="5"
                                fill="#fff8e9"
                            />

                            <ellipse
                                cx="199"
                                cy="151"
                                rx="14"
                                ry="22"
                                fill="url(#flame)"
                                class="flame"
                            />
                        </g>

                        <g class="candle candle-2">
                            <rect
                                x="241"
                                y="150"
                                width="18"
                                height="85"
                                rx="5"
                                fill="#fff8e9"
                            />

                            <ellipse
                                cx="250"
                                cy="141"
                                rx="14"
                                ry="22"
                                fill="url(#flame)"
                                class="flame"
                            />
                        </g>

                        <g class="candle candle-3">
                            <rect
                                x="292"
                                y="160"
                                width="18"
                                height="75"
                                rx="5"
                                fill="#fff8e9"
                            />

                            <ellipse
                                cx="301"
                                cy="151"
                                rx="14"
                                ry="22"
                                fill="url(#flame)"
                                class="flame"
                            />
                        </g>

                    </g>

                </svg>

            </div>


            <div
                id="cake-message"
                class="cake-message"
            >
                Happy Birthday
            </div>

        </div>

    </section>


    <!-- =====================================================
         GIFT SCENE
    ====================================================== -->

    <section
        id="gift-scene"
        class="scene"
        data-scene="gift"
    >

        <div class="gift-background">

            <div class="gift-spotlight"></div>

            <div class="gift-bokeh"></div>

            <div id="gift-particles"></div>

            <div class="gift-vignette"></div>

        </div>

        <div class="scene-content gift-content">

            <div
                id="gift-bouquet"
                class="gift-bouquet"
            >

                <div class="balloon gold-balloon">
                    <span></span>
                </div>

                <div class="balloon black-balloon">
                    <span></span>
                </div>

                <div class="balloon gold-balloon small">
                    <span></span>
                </div>

                <div class="balloon black-balloon small">
                    <span></span>
                </div>

                <div class="balloon striped-balloon">
                    <span></span>
                </div>

                <div class="balloon dotted-balloon">
                    <span></span>
                </div>

                <div class="balloon gold-balloon">
                    <span></span>
                </div>

                <div class="gift-strings"></div>

                <div
                    id="gift-box"
                    class="gift-box"
                >

                    <div class="gift-lid">
                        <div class="gift-bow"></div>
                    </div>

                    <div class="gift-body">
                        <div class="gift-ribbon vertical"></div>
                        <div class="gift-ribbon horizontal"></div>
                    </div>

                    <div class="gift-light"></div>

                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         FOG SCENE
    ====================================================== -->

    <section
        id="fog-scene"
        class="scene"
        data-scene="fog"
    >

        <div class="fog-layer fog-purple"></div>
        <div class="fog-layer fog-pink"></div>
        <div class="fog-layer fog-blue"></div>
        <div class="fog-layer fog-gold"></div>
        <div class="fog-glitter"></div>

    </section>


    <!-- =====================================================
         MEMORY GALLERY
    ====================================================== -->

    <section
        id="memory-scene"
        class="scene"
        data-scene="memory"
    >

        <div
            id="memory-background"
            class="memory-background"
        ></div>

        <div class="memory-atmosphere">
            <div class="memory-hearts"></div>
            <div class="memory-petals"></div>
            <div class="memory-sparkles"></div>
        </div>

        <div class="scene-content memory-content">

            <div
                id="memory-photo-wrapper"
                class="memory-photo-wrapper"
            >

                <img
                    id="memory-photo"
                    src="assets/photos/photo1.jpg"
                    alt="Beautiful memory"
                    onerror="this.style.display='none';"
                >

            </div>

            <p
                id="memory-caption"
                class="memory-caption"
            ></p>

        </div>

    </section>


    <!-- =====================================================
         LOVE LETTER
    ====================================================== -->

    <section
        id="letter-scene"
        class="scene"
        data-scene="letter"
    >

        <div class="letter-background">

            <div class="letter-glow"></div>
            <div class="letter-bokeh"></div>
            <div class="letter-vignette"></div>

            <div
                id="letter-petals"
                class="letter-petals"
            ></div>

        </div>

        <div class="scene-content letter-content">

            <div class="letter-paper">

                <div
                    id="letter-name"
                    class="letter-name"
                >
                    Archana
                </div>

                <div
                    id="letter-text"
                    class="letter-text"
                ></div>

                <div
                    id="letter-signoff"
                    class="letter-signoff"
                ></div>

                <div
                    id="letter-signature"
                    class="letter-signature"
                >
                     Santhosh
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         PROPOSAL SCENE
    ====================================================== -->

    <section
        id="proposal-scene"
        class="scene"
        data-scene="proposal"
    >

        <div class="proposal-background">

            <div class="moon"></div>

            <div id="stars"></div>
            <div id="fireflies"></div>
            <div id="proposal-hearts"></div>

            <div class="proposal-fog"></div>

        </div>

        <div class="scene-content proposal-content">

            <div
                id="proposal-quotes"
                class="proposal-quotes"
            >

                <div class="proposal-quote">
                    I...
                </div>

                <div class="proposal-quote">
                    Want...
                </div>
                <div class="proposal-quote">
                    To...
                </div>

                <div class="proposal-quote">
                    Say...
                </div>

            </div>


            <div
                id="proposal-final"
                class="proposal-final"
            >

                <div class="proposal-main-text">
                    I Love You So Much ♥...
                </div>
                <div class="proposal-main-text">
                     Archana
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================================
         ENDING SCENE
    ====================================================== -->

    <section
        id="ending-scene"
        class="scene"
        data-scene="ending"
    >
    

        <div class="ending-background">

            <div id="ending-fireworks"></div>
            <div id="ending-balloons"></div>

            <div class="ending-glow"></div>

            <div id="ending-sparkles"></div>

        </div>

        <div class="scene-content ending-content">

            <h1 class="ending-title">
                Happy Birthday Once Again
                <br>
                My Love.... 
            </h1>

            <div class="ending-signature">
                Forever Yours,
                <br>
                <span>♥ Santhosh ♥</span>
            </div>

        </div>

    </section>

</main>


<!-- AUDIO -->

<audio
    id="background-audio"
    loop
    preload="auto"
    playsinline
>
    <source
        src="assets/audio/birthday.mp3"
        type="audio/mpeg"
    >
</audio>


<script src="script.js"></script>

</body>
</html>
